[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-sim"
version = "0.1.0"
description = "Scheduler-in-isolation simulator for vLLM's V1 engine (GPU-free, virtual-clock driven)"
requires-python = ">=3.10"
dependencies = [
    "vllm==0.23.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
rezolus = ["pyarrow>=14"]

[project.scripts]
llm-sim = "llm_sim.cli:main"

[tool.setuptools.packages.find]
include = ["llm_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
